name: Update IMS cask

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-ims-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Verify release and update cask
        run: bun run update:ims --write
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit changed cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Casks/ims.rb; then
            echo "No cask update to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks/ims.rb
          git commit -m 'chore(ims): update cask from latest release'
          gh auth setup-git
          git push origin HEAD:master
